# rs.obayito.com — orders ops UI (Vite HMR dev) + orders API reverse proxy
# Install / refresh:
#   docker run --rm -v $PWD/deploy/nginx-rs.obayito.com.conf:/src/rs.conf:ro \
#     -v /etc/nginx/sites-available:/dst alpine:3.20 cp /src/rs.conf /dst/rs.obayito.com.conf
#   # reload host nginx master (HUP)
#
# UI (dev mode, HMR + react-grab):
#   Vite dev server on 127.0.0.1:5173 (orders-ui-dev.service)
# API:
#   orders serve on 127.0.0.1:8080
#
# To serve the static production build instead of the dev server, replace the
# "location /" Vite proxy block below with:
#   root /var/www/orders-ui;
#   index index.html;
#   location / { try_files $uri $uri/ /index.html; }
# (build: npm run build in web/, then rsync -a --delete web/dist/ /var/www/orders-ui/)

upstream orders_api {
    server 127.0.0.1:8080;
    keepalive 8;
}

map $http_upgrade $rs_dev_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name rs.obayito.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # HTTP/1.1 only (no http2): avoids Chrome module-load failures with Vite dev
    # (vite#17499). keepalive_requests raised for the many parallel /@fs|/.vite
    # module requests.
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name rs.obayito.com;

    ssl_certificate     /etc/letsencrypt/live/rs.obayito.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rs.obayito.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    keepalive_requests 10000;

    add_header X-Frame-Options        "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    client_max_body_size 6m;

    # API
    location /v1/ {
        proxy_pass http://orders_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
    }

    location = /health {
        proxy_pass http://orders_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # Ops UI — Vite dev server (HMR websocket + react-grab dev overlay)
    location / {
        proxy_pass         http://127.0.0.1:5173;
        proxy_http_version 1.1;
        proxy_buffering    off;
        proxy_cache        off;

        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $rs_dev_connection_upgrade;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
